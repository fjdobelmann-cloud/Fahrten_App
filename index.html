<!DOCTYPE html><html lang="de"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Fahrtenbuch Pro</title><script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script><style>body{font-family:Segoe UI,Arial;max-width:1200px;margin:auto;padding:20px;background:#f5f7fa}h1{color:#1f4e79}.card{background:#fff;padding:15px;border-radius:10px}input,button{padding:10px;margin:4px}table{width:100%;border-collapse:collapse;margin-top:15px;background:#fff}th,td{border:1px solid #ddd;padding:8px}th{background:#e9eef5}.stats{margin:10px 0;font-weight:bold}</style></head><body><h1>Fahrtenbuch Pro</h1><div class='card'><input id='tag' type='date'><input id='startzeit' type='time'><input id='ankunftszeit' type='time'><input id='wegstrecke' placeholder='Wegstrecke'><input id='anlass' placeholder='Anlass'><input id='entfernung' type='number' placeholder='Entfernung km'><br><button onclick='saveEntry()'>Speichern</button><button onclick='exportExcel()'>Excel (.xlsx)</button><button onclick='deleteAll()'>Alle Daten löschen</button><div class='stats' id='stats'></div></div><table><thead><tr><th>Tag</th><th>Start</th><th>Ankunft</th><th>Wegstrecke</th><th>Anlass</th><th>km</th><th>Aktion</th></tr></thead><tbody id='tbody'></tbody></table><script type='module'>import {initializeApp} from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js';import {getFirestore,collection,addDoc,getDocs,doc,updateDoc,deleteDoc} from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js';const firebaseConfig={apiKey:'AIzaSyBMN__LBaINRzLismgl1VS6D8uWvuWu6zk',authDomain:'fahrten-27fjd.firebaseapp.com',projectId:'fahrten-27fjd',storageBucket:'fahrten-27fjd.firebasestorage.app',messagingSenderId:'906370269481',appId:'1:906370269481:web:e563c99c19cd028b957738'};const app=initializeApp(firebaseConfig);const db=getFirestore(app);let editId=null;window.cache={};async function loadData(){const tb=document.getElementById('tbody');tb.innerHTML='';let sum=0;const snap=await getDocs(collection(db,'fahrten'));snap.forEach(x=>{const d=x.data();sum+=Number(d.entfernung||0);window.cache[x.id]=d;tb.innerHTML+=`<tr><td>${d.tag||''}</td><td>${d.startzeit||''}</td><td>${d.ankunftszeit||''}</td><td>${d.wegstrecke||''}</td><td>${d.anlass||''}</td><td>${d.entfernung||''}</td><td><button onclick="editRow('${x.id}')">Bearbeiten</button><button onclick="removeRow('${x.id}')">Löschen</button></td></tr>`});document.getElementById('stats').innerText='Gesamtkilometer: '+sum;}window.editRow=id=>{const d=window.cache[id];editId=id;['tag','startzeit','ankunftszeit','wegstrecke','anlass','entfernung'].forEach(k=>document.getElementById(k).value=d[k]||'');};window.saveEntry=async()=>{const data={tag:tag.value,startzeit:startzeit.value,ankunftszeit:ankunftszeit.value,wegstrecke:wegstrecke.value,anlass:anlass.value,entfernung:entfernung.value};if(editId){await updateDoc(doc(db,'fahrten',editId),data);editId=null;}else{await addDoc(collection(db,'fahrten'),data);}loadData();};window.removeRow=async id=>{if(confirm('Eintrag löschen?')){await deleteDoc(doc(db,'fahrten',id));loadData();}};window.deleteAll=async()=>{if(confirm('Wirklich alle Daten löschen?')){const s=await getDocs(collection(db,'fahrten'));for(const d of s.docs){await deleteDoc(doc(db,'fahrten',d.id));}loadData();}};window.exportExcel=async()=>{const rows=[];const s=await getDocs(collection(db,'fahrten'));s.forEach(d=>rows.push(d.data()));const ws=XLSX.utils.json_to_sheet(rows);const wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,'Fahrten');XLSX.writeFile(wb,'Fahrtenbuch.xlsx');};loadData();</script></body></html>
