<!DOCTYPE html><html lang="de"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Private Fahrten</title><style>body{font-family:Arial,sans-serif;max-width:1100px;margin:20px auto;padding:20px}input,button{padding:8px;margin:4px}table{width:100%;border-collapse:collapse;margin-top:15px}th,td{border:1px solid #ccc;padding:8px}th{background:#f2f2f2}.actions{display:flex;gap:8px;flex-wrap:wrap}</style></head><body><h1>Erfassung privater Fahrten</h1><div><input type="date" id="tag"><input type="time" id="start"><input type="time" id="ankunft"><input type="text" id="weg" placeholder="Wegstrecke"><input type="text" id="anlass" placeholder="Anlass"><input type="number" id="entfernung" placeholder="Entfernung (km)"></div><div class="actions"><button onclick="addEntry()">Eintrag speichern</button><button onclick="exportExcel()">Export nach Excel</button><button onclick="clearData()">Speicher löschen</button></div><table><thead><tr><th>Tag</th><th>Startzeit</th><th>Ankunftszeit</th><th>Wegstrecke</th><th>Anlass</th><th>Entfernung</th></tr></thead><tbody id="tbody"></tbody></table><script>const KEY='fahrten_app';function load(){const data=JSON.parse(localStorage.getItem(KEY)||'[]');const tb=document.getElementById('tbody');tb.innerHTML='';data.forEach(r=>{tb.innerHTML+=`<tr><td>${r.tag}</td><td>${r.start}</td><td>${r.ankunft}</td><td>${r.weg}</td><td>${r.anlass}</td><td>${r.entfernung}</td></tr>`;});}function addEntry(){let data=JSON.parse(localStorage.getItem(KEY)||'[]');data.push({tag:tag.value,start:start.value,ankunft:ankunft.value,weg:weg.value,anlass:anlass.value,entfernung:entfernung.value});localStorage.setItem(KEY,JSON.stringify(data));load();}function clearData(){if(confirm('Alle gespeicherten Fahrten wirklich löschen?')){localStorage.removeItem(KEY);load();}}function exportExcel(){const data=JSON.parse(localStorage.getItem(KEY)||'[]');let csv='Tag;Startzeit;Ankunftszeit;Wegstrecke;Anlass;Entfernung
';data.forEach(r=>csv+=`${r.tag};${r.start};${r.ankunft};${r.weg};${r.anlass};${r.entfernung}
`);const blob=new Blob([csv],{type:'text/csv;charset=utf-8;'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='fahrten.csv';a.click();}load();</script></body></html>
